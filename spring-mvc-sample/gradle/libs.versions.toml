#########################################################################################################
[versions]
##### plugins version #####
# https://plugins.gradle.org/plugin/io.freefair.lombok
lombok-plugin = "9.8.2"


##### libraries versions #####
spring = "6.2.19"
aspectj = "1.9.26"
slf4j = "2.0.17"
logback = "1.6.5"

jakarta-inject-api = "2.0.1"
jakarta-servlet-api = "6.0.0"

thymeleaf = "3.1.5.RELEASE"
thymeleaf-layout-dialect = "4.0.1"

webjars-locator-core = "0.59"
webjars-jquery = "4.0.0"
webjars-bootstrap = "5.3.8"

junit = "6.1.3"
hamcrest = "3.0"
assertj = "3.27.7"
mockito = "5.24.0"




#########################################################################################################
[libraries]
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-webmvc = { module = "org.springframework:spring-webmvc", version.ref = "spring" }

aspectjrt = { module = "org.aspectj:aspectjrt", version.ref = "aspectj" }

slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

jakarta-inject-api = { module = "jakarta.inject:jakarta.inject-api", version.ref = "jakarta-inject-api" }
jakarta-servlet-api = { module = "jakarta.servlet:jakarta.servlet-api", version.ref = "jakarta-servlet-api" }

thymeleaf-spring6 = { module = "org.thymeleaf:thymeleaf-spring6", version.ref = "thymeleaf" }
thymeleaf-layout-dialect = { module = "nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect", version.ref = "thymeleaf-layout-dialect" }

webjars-locator-core = { module = "org.webjars:webjars-locator-core", version.ref = "webjars-locator-core" }
webjars-jquery = { module = "org.webjars:jquery", version.ref = "webjars-jquery" }
webjars-bootstrap = { module = "org.webjars:bootstrap", version.ref = "webjars-bootstrap" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
hamcrest = { module = "org.hamcrest:hamcrest", version.ref = "hamcrest" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring" }





#########################################################################################################
[plugins]
lombok = { id = "io.freefair.lombok", version.ref = "lombok-plugin" }
